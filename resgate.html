<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resgate de Robux</title>
    <style>
        /* Estilos similares ao Roblox */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 300px;
            margin: auto;
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #4CAF50;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Resgate de Robux</h2>
        <p>Você pode resgatar 1999 Robux gratuitamente!</p>
        <button onclick="resgatar()">Resgatar</button>
    </div>

    <script>
        function resgatar() {
            // Simulando erro no resgate
            alert("Erro ao resgatar Robux! Tente novamente mais tarde.");
        }
    </script>
</body>
</html>
