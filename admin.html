<!-- admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Painel de Administração</title>
    <style>
        /* Estilos similares ao Roblox */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 300px;
            margin: auto;
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <div id="authContainer" class="container">
        <h2>Login de Administrador</h2>
        <form id="adminLoginForm">
            <input type="text" id="adminUser" placeholder="Nome de Usuário">
            <input type="password" id="adminPass" placeholder="Senha">
            <button type="submit">Entrar</button>
        </form>
    </div>

    <div id="adminPanel" style="display:none;">
        <h2>Painel de Administração</h2>
        <table id="userTable">
            <tr>
                <th>ID</th>
                <th>Usuário</th>
                <th>Email</th>
                <th>Criado em</th>
                <th>Último Login</th>
            </tr>
        </table>
    </div>

    <script>
        // Função de autenticação
        async function authenticateAdmin(username, password) {
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                
                const data = await response.json();
                if(data.success) {
                    localStorage.setItem('token', data.user.id);
                    return true;
                }
                return false;
            } catch(error) {
                console.error('Erro:', error);
                return false;
            }
        }

        // Exibir painel de admin após autenticação bem-sucedida
        async function showAdminPanel() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';

            try {
                const response = await fetch('/api/users', {
                    headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`}
                });
                
                const data = await response.json();
                if(data.success) {
                    data.users.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${user.id}</td>
                            <td>${user.username}</td>
                            <td>${user.email}</td>
                            <td>${new Date(user.created_at).toLocaleString()}</td>
                            <td>${user.last_login ? new Date(user.last_login).toLocaleString() : '-'}</td>
                        `;
                        document.getElementById('userTable').appendChild(row);
                    });
                } else {
                    alert('Falha ao carregar dados de usuários!');
                }
            } catch(error) {
                console.error('Erro:', error);
            }
        }

        // Evento de submissão do formulário de login
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('adminUser').value;
            const password = document.getElementById('adminPass').value;

            if(await authenticateAdmin(username, password)) {
                showAdminPanel();
            } else {
                alert("Credenciais inválidas!");
            }
        });
    </script>
</body>
</html>
